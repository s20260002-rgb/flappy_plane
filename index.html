  function spawnTowerExplosion(tower, impactY) {
    tower.destroyed = true;
    const gapTop = tower.gapY - tower.gap / 2;
    const gapBottom = tower.gapY + tower.gap / 2;
    const mainX = tower.x + TOWER_W * 0.55;
    const mainY = clamp(impactY, 36, GROUND_Y - 36);
    spawnExplosion(mainX, mainY, 100);

    const blastSpots = [
      rand(14, Math.max(24, gapTop - 16)),
      rand(gapBottom + 16, GROUND_Y - 16),
      clamp(impactY + rand(-80, 80), 24, GROUND_Y - 24)
    ];
    for (const blastY of blastSpots) {
      spawnExplosion(
        tower.x + TOWER_W * rand(0.36, 0.64),
        clamp(blastY, 20, GROUND_Y - 20),
        rand(34, 54)
      );
    }

    const ranges = [
      [10, Math.max(20, gapTop - 8)],
      [Math.min(GROUND_Y - 12, gapBottom + 8), GROUND_Y - 10]
    ];
    for (const [minY, maxY] of ranges) {
      for (let i = 0; i < 19; i += 1) {
        const isGlass = i % 3 === 0;
        particles.push({
          x: tower.x + rand(6, TOWER_W - 6),
          y: rand(minY, maxY),
          vx: rand(-210, 230),
          vy: rand(-270, -30),
          gravity: 680,
          life: rand(0.7, 1.4),
          maxLife: 1.4,
          size: isGlass ? rand(3, 6) : rand(4.5, 9),
          rot: rand(0, TAU),
          spin: rand(-11, 11),
          color: isGlass
            ? pick(["#9fe9ec", "#d9f6f2", "#5ab7c3", "#ffffff"])
            : pick(["#132f3d", "#1d4554", "#2c6170", "#aabec0"]),
          shape: isGlass ? "glass" : "chunk"
        });
      }
    }

    for (let i = 0; i < 6; i += 1) {
      const range = pick(ranges);
      particles.push({
        x: tower.x + rand(8, TOWER_W - 8),
        y: rand(range[0], range[1]),
        vx: rand(-120, 120),
        vy: rand(-160, -30),
        gravity: 620,
        life: rand(0.9, 1.5),
        maxLife: 1.5,
        size: rand(8, 13),
        rot: rand(0, TAU),
        spin: rand(-6, 6),
        color: pick(["#132f3d", "#1d4554", "#2c6170"]),
        shape: "chunk"
      });
    }

    for (let i = 0; i < 10; i += 1) {
      const range = pick(ranges);
      spawnSmoke(
        tower.x + rand(10, TOWER_W - 10),
        rand(range[0], range[1]),
        1
      );
    }

    // Heavy smoke sheets that frame the blast and linger after the fire fades.
    for (let i = 0; i < 12; i += 1) {
      const range = pick(ranges);
      particles.push({
        x: tower.x + rand(4, TOWER_W - 4),
        y: rand(range[0], range[1]),
        vx: rand(-55, 35),
        vy: rand(-55, -5),
        gravity: -10,
        life: rand(0.85, 1.5),
        maxLife: 1.5,
        size: rand(5, 10.5),
        rot: rand(0, TAU),
        spin: rand(-1.5, 1.5),
        color: pick(["#313431", "#47453f", "#5d584e"]),
        shape: "smoke"
      });
    }

    spawnSparkles(plane.x + 12, impactY, 10);
  }

  function updateExplosions(dt) {
    for (let i = explosions.length - 1; i >= 0; i -= 1) {
      const explosion = explosions[i];
      explosion.age += dt;
      if (explosion.age >= explosion.life) explosions.splice(i, 1);
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i -= 1) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.vy += p.gravity * dt;
      p.vx *= 1 - 0.35 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.spin * dt;
    }
  }

  /* =============================================================== gameplay */

  function getSpeed() {
    return 158 + Math.min(score * 1.15, 28);
  }

  function spawnTower() {
    const gap = Math.max(195, 235 - score * 0.9);
    const minCenter = 108 + gap / 2;
    const maxCenter = GROUND_Y - 88 - gap / 2;
    let center = rand(minCenter, maxCenter);

    if (towers.length > 0) {
      const previous = towers[towers.length - 1].gapY;
      center = clamp(center, previous - 208, previous + 208);
      center = clamp(center, minCenter, maxCenter);
    }

    towers.push({
      x: W + 38,
      gapY: center,
      gap,
      passed: false,
      variant: Math.floor(Math.random() * 3)
    });
  }

  function boost() {
    if (mode !== "playing") return;
    plane.vy = THRUST_V;
    const exhaust = planeLocalToWorld(-20, 14);
    spawnPuffs(exhaust.x, exhaust.y, 4);
    audio.boost();
  }

  function planeLocalToWorld(localX, localY) {
    const cos = Math.cos(plane.rot);
    const sin = Math.sin(plane.rot);
    return {
      x: plane.x + localX * PLANE_SCALE * cos - localY * PLANE_SCALE * sin,
      y: plane.y + localX * PLANE_SCALE * sin + localY * PLANE_SCALE * cos
    };
  }

  function addScore() {
    score += 1;
    scoreHud.textContent = String(score);
    scoreHud.classList.remove("pop");
    void scoreHud.offsetWidth;
    scoreHud.classList.add("pop");
    if (score > best) bestHud.textContent = String(score);
    audio.score();
  }

  function die(reason, hitTower = null) {
    if (mode !== "playing") return;
    setMode("dying");
    dieTimer = 0;
    plane.vy = Math.min(plane.vy, -280);
    plane.rot = Math.min(plane.rot, 0.2);

    if (reason === "tower" && hitTower) {
      spawnTowerExplosion(hitTower, plane.y);
      addShake(15, 0.58);
      audio.explosion();
    } else {
      addShake(9, 0.36);
      audio.hit();
    }

    flashScreen();
    spawnDebris(plane.x, plane.y, reason === "tower" ? 9 : 14);
    spawnPuffs(plane.x, plane.y, 6);
    const enginePoint = planeLocalToWorld(-16, 13);
    spawnSmoke(enginePoint.x, enginePoint.y, 4);
    smokeTimer = 0.05;
  }

  function updatePlaying(dt) {
    ambientTime += dt;
    const speed = getSpeed();
    worldScroll += speed * dt;

    plane.vy = Math.min(plane.vy + GRAVITY * dt, MAX_FALL);
    plane.y += plane.vy * dt;

    if (plane.y < PLANE_R + 1) {
      plane.y = PLANE_R + 1;
      plane.vy = Math.max(0, plane.vy);
    }

    const targetRot = plane.vy < 0
      ? -0.24
      : Math.min(0.92, 0.08 + (plane.vy / MAX_FALL) * 0.84);
    plane.rot = lerp(plane.rot, targetRot, Math.min(1, dt * 7));
    plane.enginePhase += dt * 28;

    towerTimer -= dt;
    if (towerTimer <= 0) {
      spawnTower();
      towerTimer = 1.42;
    }

    for (const tower of towers) tower.x -= speed * dt;

    for (const tower of towers) {
      if (!tower.passed && tower.x + TOWER_W < plane.x - PLANE_R * 0.3) {
        tower.passed = true;
        addScore();
        spawnSparkles(tower.x + TOWER_W * 0.5, tower.gapY, 9);
      }
    }

    for (const tower of towers) {
      const gapTop = tower.gapY - tower.gap / 2;
      const gapBottom = tower.gapY + tower.gap / 2;
      if (
        circleRectCollision(plane.x, plane.y, PLANE_R, tower.x + 2, -100, TOWER_W - 4, gapTop + 100) ||
        circleRectCollision(plane.x, plane.y, PLANE_R, tower.x + 2, gapBottom, TOWER_W - 4, GROUND_Y - gapBottom + 2)
      ) {
        die("tower", tower);
        return;
      }
    }

    if (plane.y + PLANE_R >= GROUND_Y - 2) {
      plane.y = GROUND_Y - PLANE_R - 2;
      die("ground");
      return;
    }

    towers = towers.filter((tower) => tower.x > -TOWER_W - 30);
    updateParticles(dt);
    updateShake(dt);
  }

  function updateDying(dt) {
    ambientTime += dt;
    worldScroll += 18 * dt;
    plane.vy = Math.min(plane.vy + GRAVITY * 1.08 * dt, MAX_FALL);
    plane.y += plane.vy * dt;
    plane.rot = Math.min(1.55, plane.rot + dt * 4.8);

    if (plane.y > GROUND_Y - PLANE_R - 2) {
      plane.y = GROUND_Y - PLANE_R - 2;
      plane.vy = 0;
      if (!plane.landed) {
        plane.landed = true;
        spawnPuffs(plane.x + 2, plane.y + 10, 7);
        addShake(3.5, 0.18);
      }
    }

    smokeTimer -= dt;
    if (smokeTimer <= 0) {
      const enginePoint = planeLocalToWorld(-16, 13);
      spawnSmoke(enginePoint.x, enginePoint.y, 1);
      smokeTimer = 0.11;
    }

    updateExplosions(dt);
    updateParticles(dt);
    updateShake(dt);

    dieTimer += dt;
    if ((plane.landed && dieTimer >= 0.5) || dieTimer >= 1.2) showGameOver();
  }

  function updateReady(dt) {
    ambientTime += dt;
    worldScroll += 20 * dt;
    plane.y = 348 + Math.sin(ambientTime * 2.25) * 6.5;
    plane.rot = Math.sin(ambientTime * 2.25 + 0.8) * 0.045;
    plane.enginePhase += dt * 16;
    updateParticles(dt);
    updateShake(dt);
  }

  function updateOver(dt) {
    ambientTime += dt;
    worldScroll += 7 * dt;
    updateExplosions(dt);
    updateParticles(dt);
    updateShake(dt);
  }

  function updateShake(dt) {
    if (shakeTime <= 0) {
      if (canvas.style.transform) canvas.style.transform = "";
      return;
    }
    shakeTime = Math.max(0, shakeTime - dt);
    const amount = shakePower * Math.min(1, shakeTime / Math.max(0.08, shakeDuration * 0.7));
    const dx = rand(-amount, amount);
    const dy = rand(-amount, amount) * 0.7;
    canvas.style.transform = `translate3d(${dx.toFixed(2)}px, ${dy.toFixed(2)}px, 0) scale(1.025)`;
    if (shakeTime === 0) canvas.style.transform = "";
  }

  /* ================================================================ drawing */

  function drawSky() {
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, "#4bc4e3");
    sky.addColorStop(0.34, "#7fd8ed");
    sky.addColorStop(0.58, "#b5ebee");
    sky.addColorStop(0.78, "#e2f4de");
    sky.addColorStop(0.9, "#ffe7bd");
    sky.addColorStop(1, "#ffdba2");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    const sunX = 375;
    const sunY = 145;
    const glow = ctx.createRadialGradient(sunX, sunY, 12, sunX, sunY, 176);
    glow.addColorStop(0, "rgba(255, 248, 198, .85)");
    glow.addColorStop(0.28, "rgba(255, 239, 168, .45)");
    glow.addColorStop(0.7, "rgba(255, 234, 161, .14)");
    glow.addColorStop(1, "rgba(255, 234, 161, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(sunX - 180, sunY - 180, 360, 360);

    ctx.beginPath();
    ctx.arc(sunX, sunY, 43, 0, TAU);
    ctx.fillStyle = "#fff2b0";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sunX - 9, sunY - 10, 27, 0, TAU);
    ctx.fillStyle = "rgba(255, 255, 224, .55)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(sunX, sunY, 64, 0, TAU);
    ctx.strokeStyle = "rgba(255, 246, 194, .22)";
    ctx.lineWidth = 16;
    ctx.stroke();
  }

  function drawCloud(x, y, scale, alpha, shape) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#fffaf0";

    ctx.beginPath();
    if (shape === 0) {
      ctx.ellipse(0, 0, 57, 17, 0, 0, TAU);
      ctx.ellipse(-31, -8, 24, 19, 0, 0, TAU);
      ctx.ellipse(4, -17, 29, 24, 0, 0, TAU);
      ctx.ellipse(34, -5, 21, 15, 0, 0, TAU);
    } else if (shape === 1) {
      ctx.ellipse(0, 0, 48, 13, 0, 0, TAU);
      ctx.ellipse(-21, -8, 20, 16, 0, 0, TAU);
      ctx.ellipse(10, -13, 25, 20, 0, 0, TAU);
      ctx.ellipse(31, -2, 16, 12, 0, 0, TAU);
    } else {
      ctx.ellipse(0, 0, 64, 15, 0, 0, TAU);
      ctx.ellipse(-40, -9, 21, 16, 0, 0, TAU);
      ctx.ellipse(-8, -14, 25, 20, 0, 0, TAU);
      ctx.ellipse(24, -12, 26, 19, 0, 0, TAU);
      ctx.ellipse(48, -2, 17, 12, 0, 0, TAU);
    }
    ctx.fill();

    ctx.globalAlpha = alpha * 0.55;
    ctx.fillStyle = "#fffefb";
    ctx.beginPath();
    ctx.ellipse(-5, -7, 28, 9, -0.08, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawClouds() {
    for (const cloud of clouds) {
      const x = mod(cloud.x - ambientTime * cloud.speed, W + 300) - 150;
      drawCloud(x, cloud.y, cloud.scale, cloud.alpha, cloud.shape);
    }
  }

  function drawHills() {
    const offset = worldScroll * 0.1;

    ctx.beginPath();
    ctx.moveTo(-30, GROUND_Y + 10);
    for (let x = -30; x <= W + 30; x += 10) {
      const y = 622 + Math.sin((x + offset) * 0.011) * 24 + Math.sin((x + offset) * 0.028 + 1.1) * 8;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 30, GROUND_Y + 10);
    ctx.closePath();
    ctx.fillStyle = "#a1ddc2";
    ctx.fill();

    const offset2 = worldScroll * 0.17;
    ctx.beginPath();
    ctx.moveTo(-30, GROUND_Y + 10);
    for (let x = -30; x <= W + 30; x += 10) {
      const y = 659 + Math.sin((x + offset2) * 0.013 + 2.4) * 19 + Math.sin((x + offset2) * 0.033) * 6;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 30, GROUND_Y + 10);
    ctx.closePath();
    ctx.fillStyle = "#7bcbae";
    ctx.fill();

    ctx.beginPath();
    for (let x = -30; x <= W + 30; x += 10) {
      const y = 659 + Math.sin((x + offset2) * 0.013 + 2.4) * 19 + Math.sin((x + offset2) * 0.033) * 6;
      if (x === -30) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "rgba(238, 255, 228, .35)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function drawBuilding(building, x) {
    const base = GROUND_Y - 3;
    const y = base - building.h;
    const tones = ["#6dbfa2", "#63b597", "#79c7aa"];

    ctx.fillStyle = tones[building.tone % tones.length];
    roundedRectPath(x, y, building.w, building.h, 3);
    ctx.fill();

    if (building.roof) {
      ctx.fillStyle = "rgba(37, 113, 90, .25)";
      ctx.fillRect(x + 3, y - 2, building.w - 6, 3);
    }

    if (building.antenna) {
      ctx.strokeStyle = "rgba(45, 121, 98, .5)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + building.w * 0.5, y);
      ctx.lineTo(x + building.w * 0.5, y - 13);
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 225, 112, .65)";
      ctx.beginPath();
      ctx.arc(x + building.w * 0.5, y - 14, 1.8, 0, TAU);
      ctx.fill();
    }

    if (building.windows) {
      ctx.fillStyle = "rgba(255, 246, 198, .48)";
      for (let wy = y + 9; wy < base - 8; wy += 11) {
        for (let wx = x + 5; wx < x + building.w - 5; wx += 9) {
          if ((wx + wy) % 3 !== 0) ctx.fillRect(wx, wy, 3.2, 5);
        }
      }
    }

    ctx.strokeStyle = "rgba(44, 122, 98, .16)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, base);
    ctx.lineTo(x, y + 3);
    ctx.stroke();
  }

  function drawCity() {
    const tile = cityBuildings.tileWidth;
    const offset = mod(worldScroll * 0.27, tile);
    for (const building of cityBuildings) {
      const baseX = building.x - offset;
      for (let copy = -1; copy <= 1; copy += 1) {
        const x = baseX + copy * tile;
        if (x > W + 20 || x + building.w < -20) continue;
        drawBuilding(building, x);
      }
    }
  }

  function drawHaze() {
    const haze = ctx.createLinearGradient(0, 555, 0, GROUND_Y);
    haze.addColorStop(0, "rgba(255, 240, 197, 0)");
    haze.addColorStop(1, "rgba(255, 234, 189, .45)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, 555, W, GROUND_Y - 555);
  }

  function drawBushes() {
    const step = 58;
    const offset = mod(-worldScroll * 0.62, step);
    const count = Math.ceil(W / step) + 3;

    ctx.fillStyle = "#4fae7e";
    ctx.beginPath();
    for (let i = -1; i < count; i += 1) {
      const x = offset + i * step + step * 0.5;
      const radius = 20 + ((i * 7 + 5) % 3) * 4.5;
      ctx.moveTo(x - radius, GROUND_Y + 10);
      ctx.arc(x, GROUND_Y + 8, radius, Math.PI, 0, false);
      ctx.lineTo(x + radius, GROUND_Y + 20);
      ctx.lineTo(x - radius, GROUND_Y + 20);
      ctx.closePath();
    }
    ctx.fill();

    ctx.fillStyle = "rgba(162, 232, 171, .24)";
    ctx.beginPath();
    for (let i = -1; i < count; i += 1) {
      const x = offset + i * step + step * 0.5;
      const radius = 20 + ((i * 7 + 5) % 3) * 4.5;
      ctx.moveTo(x - radius * 0.55, GROUND_Y + 6);
      ctx.arc(x - 3, GROUND_Y + 6, radius * 0.65, Math.PI, 0, false);
      ctx.lineTo(x - radius * 0.1, GROUND_Y + 13);
      ctx.lineTo(x - radius * 1.1, GROUND_Y + 13);
      ctx.closePath();
    }
    ctx.fill();
  }

  function drawGround() {
    const soil = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    soil.addColorStop(0, "#e0a767");
    soil.addColorStop(0.5, "#cf9356");
    soil.addColorStop(1, "#b97743");
    ctx.fillStyle = soil;
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, GROUND_Y, W, GROUND_H);
    ctx.clip();

    const stripe = mod(worldScroll, 46);
    ctx.strokeStyle = "rgba(255, 229, 181, .16)";
    ctx.lineWidth = 13;
    for (let x = -100 - stripe; x < W + 100; x += 46) {
      ctx.beginPath();
      ctx.moveTo(x, H);
      ctx.lineTo(x + 72, GROUND_Y + 16);
      ctx.stroke();
    }

    for (const pebble of pebbles) {
      const x = mod(pebble.x - worldScroll, W + 40) - 20;
      ctx.fillStyle = `rgba(96, 57, 32, ${pebble.alpha})`;
      ctx.beginPath();
      ctx.arc(x, GROUND_Y + 16 + pebble.y, pebble.r, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    const grass = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 22);
    grass.addColorStop(0, "#8ce06c");
    grass.addColorStop(0.38, "#67c957");
    grass.addColorStop(1, "#48a946");
    ctx.fillStyle = grass;
    ctx.fillRect(0, GROUND_Y, W, 21);

    const tuftOffset = mod(worldScroll, 23);
    ctx.fillStyle = "#45a646";
    ctx.beginPath();
    for (let x = -46 - tuftOffset; x < W + 30; x += 23) {
      const index = Math.round((x + tuftOffset) / 23);
      const height = 4 + ((index * 5 + 3) % 4) * 1.6;
      ctx.moveTo(x, GROUND_Y + 2);
      ctx.lineTo(x + 3.8, GROUND_Y - height);
      ctx.lineTo(x + 7.6, GROUND_Y + 2);
      ctx.closePath();
    }
    ctx.fill();

    ctx.fillStyle = "rgba(255, 255, 225, .26)";
    ctx.fillRect(0, GROUND_Y + 2, W, 2.2);

    ctx.fillStyle = "rgba(39, 112, 61, .3)";
    ctx.fillRect(0, GROUND_Y + 20, W, 3);

    const bottomShade = ctx.createLinearGradient(0, H - 42, 0, H);
    bottomShade.addColorStop(0, "rgba(93, 50, 24, 0)");
    bottomShade.addColorStop(1, "rgba(70, 38, 19, .42)");
    ctx.fillStyle = bottomShade;
    ctx.fillRect(0, H - 42, W, 42);
  }

  const TOWER_PALETTES = [
    { edge: "#0b2836", mid: "#173f52", light: "#2c6b7f", dark: "#0f3345", glass: "#8be8ea", warm: "#ffd086" },
    { edge: "#122b42", mid: "#214b62", light: "#3b7d94", dark: "#16394f", glass: "#92def3", warm: "#ffd792" },
    { edge: "#0d3034", mid: "#1c4e51", light: "#347d7f", dark: "#123b3f", glass: "#8ee7d3", warm: "#ffcf86" }
  ];

  function drawTowerSegment(x, y, height, roofY, variant) {
    const tone = TOWER_PALETTES[variant % TOWER_PALETTES.length];
    const outline = "#081f2b";
    const bodyGradient = ctx.createLinearGradient(x, 0, x + TOWER_W, 0);
    bodyGradient.addColorStop(0, tone.edge);
    bodyGradient.addColorStop(0.15, tone.mid);
    bodyGradient.addColorStop(0.34, tone.light);
    bodyGradient.addColorStop(0.6, tone.mid);
    bodyGradient.addColorStop(0.86, tone.dark);
    bodyGradient.addColorStop(1, tone.edge);

    ctx.save();
    ctx.shadowColor = "rgba(6, 32, 42, .25)";
    ctx.shadowBlur = 14;
    ctx.shadowOffsetX = 5;
    ctx.shadowOffsetY = 7;
    ctx.fillStyle = tone.edge;
    roundedRectPath(x, y, TOWER_W, height, 4);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = bodyGradient;
    roundedRectPath(x, y, TOWER_W, height, 4);
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.6;
    ctx.stroke();

    ctx.save();
    roundedRectPath(x, y, TOWER_W, height, 4);
    ctx.clip();

    const floorHeight = 25;
    const glassHeight = 13;
    const innerX = x + 9;
    const innerW = TOWER_W - 18;
    const paneGap = 3;
    const paneCount = 4;
    const paneW = (innerW - paneGap * (paneCount - 1)) / paneCount;
    let row = 0;

    for (let floorY = y + 17; floorY < y + height - 8; floorY += floorHeight) {
      ctx.fillStyle = "rgba(5, 21, 30, .42)";
      ctx.fillRect(x + 4, floorY + glassHeight, TOWER_W - 8, floorHeight - glassHeight);
      ctx.fillStyle = "rgba(158, 234, 239, .08)";
      ctx.fillRect(x + 4, floorY + glassHeight, TOWER_W - 8, 1.5);

      for (let column = 0; column < paneCount; column += 1) {
        const px = innerX + column * (paneW + paneGap);
        const seed = (row * 11 + column * 7 + variant * 5) % 13;
        const lit = seed < 4;
        const warm = seed === 0;

        if (lit) {
          ctx.fillStyle = warm ? tone.warm : tone.glass;
          ctx.globalAlpha = warm ? 0.8 : 0.72;
        } else {
          ctx.fillStyle = "#0f3345";
          ctx.globalAlpha = 0.88;
        }
        roundedRectPath(px, floorY, paneW, glassHeight, 1.2);
        ctx.fill();
        ctx.globalAlpha = 1;

        if (lit) {
          ctx.fillStyle = "rgba(255, 255, 255, .22)";
          ctx.fillRect(px + 1.5, floorY + 1.4, paneW - 3, 2);
          ctx.fillStyle = "rgba(255, 255, 255, .1)";
          ctx.fillRect(px + 1.5, floorY + 5.2, paneW - 3, 1);
        } else {
          ctx.strokeStyle = "rgba(150, 216, 221, .12)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }

      if (row % 3 === 1) {
        ctx.fillStyle = "rgba(169, 224, 226, .24)";
        ctx.fillRect(x + 2, floorY + glassHeight + 2, TOWER_W - 4, 1.8);
      }
      row += 1;
    }

    // Glass sheen and steel mullions.
    const sheen = ctx.createLinearGradient(x, 0, x + TOWER_W, 0);
    sheen.addColorStop(0, "rgba(255, 255, 255, 0)");
    sheen.addColorStop(0.24, "rgba(255, 255, 255, .055)");
    sheen.addColorStop(0.42, "rgba(255, 255, 255, .015)");
    sheen.addColorStop(1, "rgba(255, 255, 255, 0)");
    ctx.fillStyle = sheen;
    ctx.fillRect(x, y, TOWER_W, height);

    ctx.fillStyle = "rgba(175, 230, 231, .28)";
    ctx.fillRect(x + 6, y, 2.2, height);
    ctx.fillRect(x + TOWER_W - 8.5, y, 2.2, height);

    ctx.fillStyle = "rgba(5, 24, 33, .34)";
    ctx.fillRect(x + 4, y, 3, height);
    ctx.fillRect(x + TOWER_W - 10, y, 4, height);

    ctx.fillStyle = "rgba(133, 235, 233, .2)";
    ctx.fillRect(x + 13, y + 14, 1.5, Math.max(0, height - 28));

    // Lobby at street level.
    if (y + height >= GROUND_Y - 1) {
      const lobbyW = 42;
      const lobbyH = 36;
      const lobbyX = x + (TOWER_W - lobbyW) / 2;
      const lobbyY = GROUND_Y - lobbyH;

      ctx.fillStyle = "#d2e1df";
      ctx.strokeStyle = outline;
      ctx.lineWidth = 2;
      ctx.fillRect(lobbyX - 5, lobbyY - 6, lobbyW + 10, 5);
      ctx.strokeRect(lobbyX - 5, lobbyY - 6, lobbyW + 10, 5);

      const lobbyGradient = ctx.createLinearGradient(0, lobbyY, 0, GROUND_Y);
      lobbyGradient.addColorStop(0, "#ffe0a0");
      lobbyGradient.addColorStop(0.48, "#a6c9c1");
      lobbyGradient.addColorStop(1, "#315c66");
      ctx.fillStyle = lobbyGradient;
      ctx.fillRect(lobbyX, lobbyY, lobbyW, lobbyH);
      ctx.strokeStyle = outline;
      ctx.lineWidth = 2;
      ctx.strokeRect(lobbyX, lobbyY, lobbyW, lobbyH);

      ctx.fillStyle = "rgba(13, 44, 55, .58)";
      for (let mullion = 1; mullion < 5; mullion += 1) {
        ctx.fillRect(lobbyX + (lobbyW / 5) * mullion - 1, lobbyY + 2, 2, lobbyH - 4);
      }

      ctx.fillStyle = "#123845";
      ctx.fillRect(lobbyX + lobbyW / 2 - 6, lobbyY + 9, 12, lobbyH - 9);
      ctx.strokeStyle = "rgba(255, 237, 190, .35)";
      ctx.lineWidth = 1;
      ctx.strokeRect(lobbyX + lobbyW / 2 - 6, lobbyY + 9, 12, lobbyH - 9);
      ctx.fillStyle = "#e6c27d";
      ctx.beginPath();
      ctx.arc(lobbyX + lobbyW / 2 - 2, lobbyY + 24, 1.2, 0, TAU);
      ctx.fill();

      ctx.fillStyle = "#a8c0c0";
      ctx.fillRect(lobbyX - 4, GROUND_Y - 3, lobbyW + 8, 3);
    }
    ctx.restore();

    const roofX = x - ROOF_OVERHANG;
    const roofW = TOWER_W + ROOF_OVERHANG * 2;
    const roofGradient = ctx.createLinearGradient(0, roofY, 0, roofY + ROOF_H);
    roofGradient.addColorStop(0, "#e4eeee");
    roofGradient.addColorStop(0.22, "#b9ced1");
    roofGradient.addColorStop(0.7, "#819fa7");
    roofGradient.addColorStop(1, "#597983");

    ctx.save();
    ctx.shadowColor = "rgba(6, 32, 42, .28)";
    ctx.shadowBlur = 14;
    ctx.shadowOffsetX = 5;
    ctx.shadowOffsetY = 7;
    ctx.fillStyle = "#597983";
    roundedRectPath(roofX, roofY, roofW, ROOF_H, 4);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = roofGradient;
    roundedRectPath(roofX, roofY, roofW, ROOF_H, 4);
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.6;
    ctx.stroke();

    ctx.fillStyle = "rgba(145, 241, 241, .55)";
    ctx.fillRect(roofX + 6, roofY + 3.5, roofW - 12, 2);
    ctx.fillStyle = "rgba(145, 241, 241, .27)";
    ctx.fillRect(roofX + 6, roofY + ROOF_H - 5.5, roofW - 12, 2);

    ctx.fillStyle = "rgba(19, 49, 59, .65)";
    for (let vent = 0; vent < 3; vent += 1) {
      ctx.fillRect(roofX + 22 + vent * 18, roofY + 12, 11, 6);
      ctx.fillStyle = "rgba(160, 220, 223, .2)";
      ctx.fillRect(roofX + 22 + vent * 18, roofY + 12, 11, 1.5);
      ctx.fillStyle = "rgba(19, 49, 59, .65)";
    }

    ctx.fillStyle = "rgba(255, 248, 225, .3)";
    ctx.fillRect(roofX + 10, roofY + ROOF_H - 10, roofW - 20, 1);

    const blink = 0.55 + 0.45 * Math.sin(ambientTime * 4.2 + variant * 2.1);
    ctx.fillStyle = `rgba(255, 84, 62, ${0.45 + 0.55 * blink})`;
    ctx.beginPath();
    ctx.arc(roofX + roofW - 13, roofY + ROOF_H / 2, 2.4, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 82, 58, ${0.12 * blink})`;
    ctx.beginPath();
    ctx.arc(roofX + roofW - 13, roofY + ROOF_H / 2, 7.5, 0, TAU);
    ctx.fill();
  }

  function drawTower(tower) {
    if (tower.destroyed) return;
    const gapTop = tower.gapY - tower.gap / 2;
    const gapBottom = tower.gapY + tower.gap / 2;
    const variant = tower.variant || 0;

    drawTowerSegment(tower.x, -60, gapTop + 60, gapTop - ROOF_H, variant);
    drawTowerSegment(tower.x, gapBottom, GROUND_Y - gapBottom + 3, gapBottom, variant);
  }

  function drawExplosions() {
    for (const explosion of explosions) {
      const progress = clamp(explosion.age / explosion.life, 0, 1);
      if (progress >= 1) continue;
      const fade = 1 - progress;
      const radius = explosion.radius * (0.34 + progress * 0.92);
      const lobes = [
        { angle: 0.3, distance: 0.12, scale: 0.82 },
        { angle: 2.4, distance: 0.26, scale: 0.56 },
        { angle: 4.35, distance: 0.22, scale: 0.62 },
        { angle: 5.6, distance: 0.3, scale: 0.45 }
      ];

      ctx.save();
      ctx.globalAlpha = clamp(fade * 1.3, 0, 1);

      for (const lobe of lobes) {
        const lobeX = explosion.x + Math.cos(lobe.angle) * radius * lobe.distance;
        const lobeY = explosion.y + Math.sin(lobe.angle) * radius * lobe.distance;
        const lobeRadius = Math.max(1, radius * lobe.scale);
        const fireball = ctx.createRadialGradient(lobeX, lobeY, 0, lobeX, lobeY, lobeRadius);
        fireball.addColorStop(0, "rgba(255, 250, 215, .98)");
        fireball.addColorStop(0.15, "rgba(255, 226, 112, .96)");
        fireball.addColorStop(0.38, "rgba(255, 145, 48, .92)");
        fireball.addColorStop(0.64, "rgba(213, 70, 27, .68)");
        fireball.addColorStop(0.84, "rgba(92, 44, 29, .3)");
        fireball.addColorStop(1, "rgba(58, 38, 29, 0)");
        ctx.fillStyle = fireball;
        ctx.beginPath();
        ctx.arc(lobeX, lobeY, lobeRadius, 0, TAU);
        ctx.fill();
      }

      ctx.globalAlpha = 0.82 * fade;
      ctx.fillStyle = "rgba(255, 251, 224, .95)";
      ctx.beginPath();
      ctx.arc(explosion.x, explosion.y, Math.max(1, radius * 0.11), 0, TAU);
      ctx.fill();
      ctx.restore();

      if (explosion.radius > 60) {
        ctx.save();
        ctx.globalAlpha = 0.62 * fade;
        ctx.strokeStyle = "rgba(255, 197, 116, .9)";
        ctx.lineWidth = Math.max(1, 8 * fade);
        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, radius * 1.25, 0, TAU);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255, 240, 188, .5)";
        ctx.lineWidth = Math.max(1, 2 * fade);
        ctx.beginPath();
        ctx.arc(explosion.x, explosion.y, radius * 1.4, 0, TAU);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawParticles() {
    for (const particle of particles) {
      const alpha = clamp(particle.life / particle.maxLife, 0, 1);
      ctx.save();
      ctx.translate(particle.x, particle.y);
      ctx.rotate(particle.rot);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = particle.color;

      if (particle.shape === "chunk") {
        const r = particle.size;
        ctx.beginPath();
        ctx.moveTo(-r, -r * 0.5);
        ctx.lineTo(r * 0.7, -r * 0.75);
        ctx.lineTo(r, r * 0.35);
        ctx.lineTo(-r * 0.35, r * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(7, 24, 31, .42)";
        ctx.lineWidth = 0.9;
        ctx.stroke();
      } else if (particle.shape === "fire") {
        ctx.globalAlpha = alpha * 0.92;
        ctx.beginPath();
        ctx.arc(0, 0, particle.size * (0.55 + alpha * 0.75), 0, TAU);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 251, 223, .5)";
        ctx.beginPath();
        ctx.arc(0, 0, particle.size * alpha * 0.28, 0, TAU);
        ctx.fill();
      } else if (particle.shape === "glass") {
        const r = particle.size;
        ctx.beginPath();
        ctx.moveTo(0, -r * 1.35);
        ctx.lineTo(r * 0.75, r * 0.6);
        ctx.lineTo(-r * 0.55, r);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(255, 255, 255, .38)";
        ctx.lineWidth = 0.8;
        ctx.stroke();
      } else if (particle.shape === "shard") {
        const r = particle.size;
        ctx.beginPath();
        ctx.moveTo(0, -r * 1.2);
        ctx.lineTo(r * 0.8, r * 0.55);
        ctx.lineTo(-r * 0.6, r);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(49, 30, 18, .28)";
        ctx.lineWidth = 0.8;
        ctx.stroke();
      } else if (particle.shape === "smoke") {
        const radius = particle.size * (1.1 + (1 - alpha) * 1.2);
        const puff = ctx.createRadialGradient(
          -radius * 0.18,
          -radius * 0.18,
          radius * 0.08,
          0,
          0,
          radius
        );
        puff.addColorStop(0, particle.color);
        puff.addColorStop(0.52, particle.color);
        puff.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.globalAlpha = alpha * 0.4;
        ctx.fillStyle = puff;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, TAU);
        ctx.fill();
      } else if (particle.shape === "spark") {
        ctx.beginPath();
        for (let i = 0; i < 8; i += 1) {
          const radius = i % 2 === 0 ? particle.size : particle.size * 0.38;
          const angle = (i / 8) * TAU - Math.PI / 2;
          const px = Math.cos(angle) * radius;
          const py = Math.sin(angle) * radius;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, particle.size * alpha, 0, TAU);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  function drawPlane() {
    const dead = mode === "dying" || mode === "over";
    const bob = mode === "ready" ? 1 + Math.sin(ambientTime * 4.5) * 0.008 : 1;
    const outline = "#1a3140";

    ctx.save();
    ctx.translate(plane.x, plane.y);
    ctx.rotate(plane.rot);
    ctx.scale(bob * PLANE_SCALE, bob * PLANE_SCALE);

    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.2;

    // Soft separation shadow.
    ctx.fillStyle = "rgba(17, 55, 68, .1)";
    ctx.beginPath();
    ctx.ellipse(-2, 8, 31, 12, 0, 0, TAU);
    ctx.fill();

    // Far wing.
    ctx.fillStyle = "rgba(136, 175, 187, .65)";
    ctx.beginPath();
    ctx.moveTo(6, 1);
    ctx.lineTo(-14, 8);
    ctx.lineTo(-6, 11);
    ctx.lineTo(12, 4);
    ctx.closePath();
    ctx.fill();

    // Horizontal stabilizer.
    ctx.fillStyle = "#dce8ea";
    ctx.beginPath();
    ctx.moveTo(-25, 2.5);
    ctx.lineTo(-38, 8);
    ctx.quadraticCurveTo(-39, 9.5, -35, 10);
    ctx.lineTo(-15, 5.5);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "#1d4f72";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-25, 2.5);
    ctx.lineTo(-37, 8);
    ctx.stroke();

    // Main swept wing.
    const wingGradient = ctx.createLinearGradient(0, 3, 0, 24);
    wingGradient.addColorStop(0, "#eef6f5");
    wingGradient.addColorStop(0.55, "#bed6db");
    wingGradient.addColorStop(1, "#9fc3cc");
    ctx.fillStyle = wingGradient;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(18, 3);
    ctx.bezierCurveTo(6, 5, -9, 10, -26, 19);
    ctx.lineTo(-13, 23);
    ctx.bezierCurveTo(-2, 15, 10, 10, 21, 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = "rgba(255, 255, 255, .6)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(16, 4.2);
    ctx.bezierCurveTo(4, 6.5, -9, 11.5, -23, 18.2);
    ctx.stroke();

    ctx.strokeStyle = "rgba(36, 91, 109, .32)";
    ctx.lineWidth = 0.85;
    ctx.beginPath();
    ctx.moveTo(11, 6);
    ctx.quadraticCurveTo(-5, 12, -20, 20);
    ctx.stroke();

    ctx.fillStyle = "#1b3e5a";
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-26, 19);
    ctx.quadraticCurveTo(-31, 15, -31.5, 12);
    ctx.quadraticCurveTo(-27.5, 17, -21.5, 21);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Green navigation light at the wingtip.
    const wingLight = 0.55 + 0.45 * Math.sin(ambientTime * 5.5 + 0.6);
    ctx.fillStyle = `rgba(94, 255, 167, ${0.5 + 0.5 * wingLight})`;
    ctx.beginPath();
    ctx.arc(-30, 17.5, 1.25, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(94, 255, 167, ${0.12 * wingLight})`;
    ctx.beginPath();
    ctx.arc(-30, 17.5, 4.5, 0, TAU);
    ctx.fill();

    // Tail fin.
    const finGradient = ctx.createLinearGradient(-36, -24, -14, -2);
    finGradient.addColorStop(0, "#245a80");
    finGradient.addColorStop(1, "#153b58");
    ctx.fillStyle = finGradient;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-31, 0);
    ctx.quadraticCurveTo(-36, -4, -36, -8);
    ctx.lineTo(-31, -25);
    ctx.quadraticCurveTo(-27, -25, -23, -22);
    ctx.lineTo(-14, -3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.strokeStyle = "#f0c46b";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-34, -7);
    ctx.quadraticCurveTo(-33, -17, -27, -24);
    ctx.stroke();

    ctx.strokeStyle = "rgba(151, 236, 235, .55)";
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(-31.5, -7);
    ctx.quadraticCurveTo(-30.5, -15, -25, -21.5);
    ctx.stroke();

    ctx.save();
    ctx.translate(-27.5, -13.2);
    ctx.rotate(-0.2);
    ctx.font = '900 6.5px "Arial Rounded MT Bold", system-ui, sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff8e4";
    ctx.fillText("303", 0, 0);
    ctx.restore();

    // Fuselage.
    const bodyPath = () => {
      ctx.beginPath();
      ctx.moveTo(-33, -1);
      ctx.bezierCurveTo(-30, -6, -22, -8, -10, -8);
      ctx.bezierCurveTo(7, -8, 22, -7, 28, -4);
      ctx.bezierCurveTo(31, -2.5, 32.5, 0, 30.5, 2.3);
      ctx.bezierCurveTo(27, 5.8, 18, 7.6, 6, 8);
      ctx.bezierCurveTo(-10, 8.5, -26, 6.5, -32, 3);
      ctx.closePath();
    };
    const bodyGradient = ctx.createLinearGradient(0, -8, 0, 8);
    bodyGradient.addColorStop(0, "#ffffff");
    bodyGradient.addColorStop(0.36, "#eef5f3");
    bodyGradient.addColorStop(0.72, "#d6e4e5");
    bodyGradient.addColorStop(1, "#b9ced3");
    ctx.fillStyle = bodyGradient;
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.2;
    bodyPath();
    ctx.fill();
    ctx.stroke();

    ctx.save();
    bodyPath();
    ctx.clip();

    ctx.fillStyle = "rgba(255, 255, 255, .62)";
    ctx.beginPath();
    ctx.ellipse(-3, -6, 23, 2.4, 0, 0, TAU);
    ctx.fill();

    // Blue cheatline with a warm pinstripe.
    ctx.fillStyle = "#194b70";
    ctx.beginPath();
    ctx.moveTo(-34, 1.2);
    ctx.bezierCurveTo(-25, 4.2, -8, 5.2, 7, 5.3);
    ctx.bezierCurveTo(16, 5.2, 24, 4.2, 31, 2.4);
    ctx.lineTo(31, 4.2);
    ctx.bezierCurveTo(22, 6.5, 10, 7.7, -2, 7.6);
    ctx.bezierCurveTo(-16, 7.3, -27, 5.8, -34, 3.5);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#f0c46b";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-33, 1.2);
    ctx.bezierCurveTo(-24, 4, -8, 5, 7, 5.1);
    ctx.bezierCurveTo(16, 5, 24, 4.1, 30.5, 2.4);
    ctx.stroke();

    // Cabin windows.
    ctx.fillStyle = "#12394f";
    for (let windowX = -22; windowX <= 18; windowX += 4.3) {
      roundedRectPath(windowX, -3.7, 2.1, 2.2, 0.65);
      ctx.fill();
    }
    ctx.fillStyle = "rgba(255, 255, 255, .38)";
    for (let windowX = -22; windowX <= 18; windowX += 8.6) {
      ctx.fillRect(windowX + 0.35, -3.25, 0.7, 0.55);
    }

    // Cockpit windows.
    ctx.fillStyle = "#133b55";
    ctx.beginPath();
    ctx.moveTo(17.5, -6.2);
    ctx.lineTo(23.4, -4.9);
    ctx.lineTo(22.6, -2.2);
    ctx.lineTo(17.2, -2.6);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(24.2, -4.8);
    ctx.lineTo(28.3, -3.2);
    ctx.lineTo(27.8, -1.5);
    ctx.lineTo(23.4, -2.1);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, .34)";
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(18.2, -5.5);
    ctx.lineTo(23, -4.4);
    ctx.stroke();

    // Door outlines and a subtle panel seam.
    ctx.strokeStyle = "rgba(22, 66, 91, .38)";
    ctx.lineWidth = 0.8;
    ctx.strokeRect(8.5, -6.2, 2.5, 9);
    ctx.strokeRect(-18.5, -6.2, 2.5, 9);
    ctx.beginPath();
    ctx.moveTo(-31, -0.5);
    ctx.bezierCurveTo(-20, 1.5, 8, 1.8, 29, 0.2);
    ctx.stroke();

    // APU exhaust at the tail cone.
    ctx.fillStyle = "#244b5b";
    ctx.beginPath();
    ctx.arc(-32, 3.2, 1.1, 0, TAU);
    ctx.fill();
    ctx.restore();

    // Keep the silhouette crisp after all the clipped details.
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.2;
    bodyPath();
    ctx.stroke();

    // Engine pod.
    ctx.save();
    ctx.translate(-2, 14);
    ctx.rotate(0.02);
    ctx.strokeStyle = outline;
    ctx.lineWidth = 2.1;

    ctx.beginPath();
    ctx.moveTo(3, -6);
    ctx.lineTo(4, -1);
    ctx.stroke();

    const nacelleGradient = ctx.createLinearGradient(0, -5, 0, 5);
    nacelleGradient.addColorStop(0, "#f2f8f6");
    nacelleGradient.addColorStop(0.45, "#c8dde0");
    nacelleGradient.addColorStop(1, "#819fa9");
    ctx.fillStyle = nacelleGradient;
    roundedRectPath(-11, -4.7, 21, 9.4, 4.6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#dbe7e8";
    ctx.beginPath();
    ctx.ellipse(9.2, 0, 3.5, 4.2, 0, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    ctx.fillStyle = "#103b50";
    ctx.beginPath();
    ctx.ellipse(9.2, 0, 2.5, 3.1, 0, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.translate(9.2, 0);
    ctx.rotate(plane.enginePhase * 0.72);
    ctx.strokeStyle = "rgba(150, 235, 239, .65)";
    ctx.lineWidth = 0.8;
    for (let fan = 0; fan < 3; fan += 1) {
      const angle = (fan / 3) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(angle) * 0.4, Math.sin(angle) * 0.4);
      ctx.lineTo(Math.cos(angle) * 2.3, Math.sin(angle) * 2.3);
      ctx.stroke();
    }
    ctx.restore();

    ctx.fillStyle = "#284c5b";
    roundedRectPath(-14.5, -3.2, 4.2, 6.4, 1.6);
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = "#0a2331";
    ctx.beginPath();
    ctx.ellipse(-14.3, 0, 1.6, 3, 0, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = "rgba(255, 255, 255, .62)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-7.5, -3.4);
    ctx.lineTo(4, -3.4);
    ctx.stroke();

    if (!dead && mode === "playing") {
      const flicker = 0.34 + Math.random() * 0.16;
      ctx.fillStyle = `rgba(255, 174, 84, ${flicker})`;
      ctx.beginPath();
      ctx.ellipse(-18, 0, 5.2, 2.2, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = `rgba(255, 244, 200, ${flicker * 0.7})`;
      ctx.beginPath();
      ctx.ellipse(-16.5, 0, 2.6, 1.2, 0, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // Fuselage beacon.
    const beacon = 0.55 + 0.45 * Math.sin(ambientTime * 5.2);
    ctx.fillStyle = `rgba(255, 72, 55, ${0.45 + 0.55 * beacon})`;
    ctx.beginPath();
    ctx.arc(5, -8.7, 1.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(255, 76, 58, ${0.13 * beacon})`;
    ctx.beginPath();
    ctx.arc(5, -8.7, 5, 0, TAU);
    ctx.fill();

    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawSky();
    drawClouds();
    drawHills();
    drawCity();
    drawHaze();
    drawBushes();
    drawGround();

    for (const tower of towers) drawTower(tower);
    drawExplosions();
    drawParticles();
    drawPlane();
  }

  /* ================================================================ runners */

  function setupCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
  }

  function update(dt) {
    if (mode === "playing") updatePlaying(dt);
    else if (mode === "ready") updateReady(dt);
    else if (mode === "dying") updateDying(dt);
    else if (mode === "over") updateOver(dt);
  }

  function frame(now) {
    const elapsed = lastFrame ? (now - lastFrame) / 1000 : 0;
    lastFrame = now;
    const dt = Math.min(elapsed, 1 / 30);
    if (mode !== "paused") update(dt);
    render();
    window.requestAnimationFrame(frame);
  }

  /* ================================================================= input */

  function onPointerDown(event) {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    const target = event.target;
    if (target instanceof Element && target.closest("button")) return;

    if (mode === "playing") {
      event.preventDefault();
      boost();
    } else if (mode === "ready") {
      event.preventDefault();
      startGame();
    } else if (mode === "paused") {
      event.preventDefault();
      resumeGame();
    }
  }

  function onKeyDown(event) {
    const key = event.code;

    if (key === "Space" || key === "ArrowUp" || key === "KeyW") {
      if (event.repeat) return;
      event.preventDefault();
      if (mode === "ready") {
        startGame();
      } else if (mode === "playing") {
        boost();
      } else if (mode === "paused") {
        resumeGame();
      } else if (mode === "over" && performance.now() - overShownAt > 420) {
        startGame();
      }
      return;
    }

    if (key === "KeyP" || key === "Escape") {
      if (mode === "playing" || mode === "paused") {
        event.preventDefault();
        togglePause();
      }
      return;
    }

    if (key === "KeyM") {
      toggleSound();
    }
  }

  function toggleSound() {
    audio.setMuted(!audio.muted);
    syncSoundButton();
    if (!audio.muted) audio.click();
  }

  function syncSoundButton() {
    soundBtn.classList.toggle("is-muted", audio.muted);
    soundBtn.setAttribute("aria-pressed", String(audio.muted));
    soundBtn.setAttribute("aria-label", audio.muted ? "Unmute sound" : "Mute sound");
  }

  function onVisibilityChange() {
    if (document.hidden) {
      if (mode === "playing") pauseGame();
    } else {
      lastFrame = performance.now();
    }
  }

  /* ================================================================== wire */

  gameEl.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("resize", setupCanvas);
  document.addEventListener("visibilitychange", onVisibilityChange);

  playBtn.addEventListener("click", () => {
    startGame();
  });

  replayBtn.addEventListener("click", () => {
    startGame();
  });

  resumeBtn.addEventListener("click", () => {
    resumeGame();
  });

  pauseBtn.addEventListener("click", () => {
    pauseGame();
  });

  homeBtn.addEventListener("click", () => {
    goHome();
  });

  quitBtn.addEventListener("click", () => {
    goHome();
  });

  soundBtn.addEventListener("click", () => {
    toggleSound();
  });

  overScreen.addEventListener("pointerdown", (event) => {
    if (event.target === overScreen) event.preventDefault();
  });

  /* ================================================================== boot */

  setupCanvas();
  syncBestLabels();
  syncSoundButton();
  setMode("ready");
  lastFrame = performance.now();
  render();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
