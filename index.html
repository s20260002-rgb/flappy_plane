<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8cdcef">
<meta name="description" content="Flappy Plane — a tiny jet adventure between glass skyscrapers.">
<title>Flappy Plane</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%238cdcef'/%3E%3Cpath d='M14 58 48 46 84 50 90 57 54 60 38 82 28 82 37 62 16 69Z' fill='%23f8fcfb' stroke='%231a3140' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M48 46 55 32 66 49Z' fill='%231d4f72' stroke='%231a3140' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M54 60 57 73 48 73Z' fill='%231d4f72' stroke='%231a3140' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #153f35;
    --ink-deep: #0c2e26;
    --cream: #fff9e9;
    --gold: #ffd349;
    --gold-deep: #f0a31b;
    --mint: #bfeadd;
    --font-display: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", ui-rounded, "Trebuchet MS", system-ui, sans-serif;
    --font-body: ui-rounded, "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "Trebuchet MS", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(55vmax 55vmax at 88% 4%, rgba(255, 232, 174, .92), transparent 62%),
      radial-gradient(48vmax 48vmax at 2% 98%, rgba(174, 235, 203, .75), transparent 64%),
      linear-gradient(155deg, #d9f5ff 0%, #e9fcf2 52%, #fff1d1 100%);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: .6;
    background-image:
      radial-gradient(circle at 16% 22%, rgba(255, 255, 255, .55) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 70%, rgba(255, 255, 255, .4) 0 1.5px, transparent 2.5px);
    background-size: 110px 110px, 90px 90px;
  }

  button {
    font: inherit;
    border: 0;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  button:focus-visible {
    outline: .65cqw solid #0d5b48;
    outline-offset: .65cqw;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------------------------------------------------------------- shell */

  .game {
    position: relative;
    z-index: 1;
    width: min(100vw, calc(94vh * .6), 520px);
    width: min(100vw, calc(94svh * .6), 520px);
    aspect-ratio: 3 / 5;
    border-radius: clamp(22px, 4vw, 34px);
    overflow: hidden;
    isolation: isolate;
    container-type: inline-size;
    background: #8cdcef;
    box-shadow:
      0 40px 90px -34px rgba(8, 55, 47, .58),
      0 14px 34px -16px rgba(8, 55, 47, .34);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .game::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 46;
    border-radius: inherit;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, .42);
    box-shadow:
      inset 0 0 0 1px rgba(17, 66, 54, .05),
      inset 0 0 70px rgba(9, 56, 48, .12);
  }

  #gameCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    transform-origin: 50% 50%;
    will-change: transform;
  }

  .corners {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(8, 67, 71, .16), transparent 15%),
      linear-gradient(0deg, rgba(8, 53, 43, .18), transparent 14%);
  }

  /* ------------------------------------------------------------------ hud */

  .hud {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  .best-chip {
    position: absolute;
    left: 4.6cqw;
    top: 4.6cqw;
    display: flex;
    align-items: center;
    gap: 1.2cqw;
    padding: 1.5cqw 2.5cqw 1.5cqw 2.1cqw;
    border-radius: 999px;
    color: #fffdf0;
    background: rgba(9, 60, 49, .27);
    border: 1px solid rgba(255, 255, 255, .32);
    box-shadow: 0 .6cqw 1.4cqw rgba(8, 53, 43, .12);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    font-family: var(--font-display);
    font-size: 2.15cqw;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
    text-shadow: 0 1px 2px rgba(6, 40, 34, .25);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-1.2cqw);
    transition: opacity .3s ease, transform .3s ease, visibility .3s;
  }

  .best-chip svg {
    width: 3.2cqw;
    height: 3.2cqw;
    display: block;
    opacity: .9;
  }

  .best-chip b {
    font-size: 2.8cqw;
    letter-spacing: 0;
    line-height: 1;
  }

  .score {
    position: absolute;
    top: 2.4cqw;
    left: 50%;
    z-index: 1;
    transform: translate(-50%, -1.2cqw);
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 11.5cqw;
    line-height: 1;
    letter-spacing: -.03em;
    color: #fff9e7;
    -webkit-text-stroke: .55cqw #184a3c;
    paint-order: stroke fill;
    text-shadow:
      0 1cqw 0 #184a3c,
      0 1.7cqw 2.4cqw rgba(7, 45, 36, .3);
    opacity: 0;
    visibility: hidden;
    transition: opacity .3s ease, visibility .3s;
  }

  .score.pop {
    animation: score-pop .32s cubic-bezier(.2, 1.6, .4, 1);
  }

  @keyframes score-pop {
    0%   { transform: translate(-50%, -1.2cqw) scale(1); }
    38%  { transform: translate(-50%, -1.2cqw) scale(1.34) rotate(-3deg); }
    100% { transform: translate(-50%, -1.2cqw) scale(1); }
  }

  .hud-controls {
    position: absolute;
    top: 4.6cqw;
    right: 4.6cqw;
    display: flex;
    gap: 2.1cqw;
  }

  .icon-btn {
    width: clamp(42px, 9.4cqw, 48px);
    height: clamp(42px, 9.4cqw, 48px);
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    cursor: pointer;
    pointer-events: auto;
    color: #fffdf0;
    background: rgba(9, 60, 49, .27);
    border: 1px solid rgba(255, 255, 255, .34);
    box-shadow: 0 .6cqw 1.4cqw rgba(8, 53, 43, .13);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    transition: transform .15s ease, background .2s ease, opacity .25s ease;
  }

  .icon-btn svg {
    width: 4.6cqw;
    height: 4.6cqw;
    display: block;
  }

  .icon-btn:hover { background: rgba(9, 60, 49, .4); }
  .icon-btn:active { transform: scale(.9); }

  .pause-btn {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: scale(.82);
  }

  .sound-btn .icon-muted { display: none; }
  .sound-btn.is-muted .icon-on { display: none; }
  .sound-btn.is-muted .icon-muted { display: block; }

  .game[data-mode="playing"] .best-chip,
  .game[data-mode="dying"] .best-chip,
  .game[data-mode="paused"] .best-chip {
    opacity: 1;
    visibility: visible;
    transform: none;
  }

  .game[data-mode="playing"] .score,
  .game[data-mode="dying"] .score,
  .game[data-mode="paused"] .score {
    opacity: 1;
    visibility: visible;
  }

  .game[data-mode="playing"] .pause-btn,
  .game[data-mode="paused"] .pause-btn {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: none;
  }

  /* --------------------------------------------------------------- screens */

  .screen {
    position: absolute;
    inset: 0;
    z-index: 30;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .32s ease, visibility .32s;
  }

  .screen.is-visible {
    opacity: 1;
    visibility: visible;
  }

  .screen button { pointer-events: auto; }

  /* ------------------------------------------------------------- ready ui */

  .ready-screen {
    display: grid;
    grid-template-rows: auto 1fr auto;
    justify-items: center;
    padding: 9cqw 7cqw 16cqw;
    background: linear-gradient(180deg, rgba(8, 70, 74, .08), transparent 24%, transparent 68%, rgba(9, 58, 44, .06));
  }

  .brand {
    text-align: center;
    filter: drop-shadow(0 1.6cqw 2.4cqw rgba(11, 62, 51, .14));
    animation: brand-in .8s cubic-bezier(.16, 1.25, .38, 1) both;
  }

  .brand-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 1.4cqw;
    padding: 1.35cqw 2.8cqw;
    border-radius: 999px;
    color: #1b5947;
    background: rgba(255, 250, 235, .74);
    border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 .8cqw 2cqw rgba(14, 75, 61, .08);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    font-size: 1.85cqw;
    font-weight: 900;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  .brand-eyebrow::before,
  .brand-eyebrow::after {
    content: "";
    width: 1.8cqw;
    height: 1.8cqw;
    background: #efad23;
    clip-path: polygon(50% 0, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0 50%, 39% 38%);
    opacity: .85;
  }

  .brand h1 {
    margin: 2.2cqw 0 0;
    font-family: var(--font-display);
    font-weight: 900;
    text-transform: uppercase;
  }

  .brand-flappy,
  .brand-plane {
    display: block;
    paint-order: stroke fill;
    -webkit-text-stroke-color: #174b3d;
    text-transform: uppercase;
  }

  .brand-flappy {
    font-size: 8.6cqw;
    line-height: .94;
    letter-spacing: .08em;
    color: #fff9e8;
    -webkit-text-stroke-width: .52cqw;
    text-shadow:
      0 .75cqw 0 #174b3d,
      0 1.7cqw 2.2cqw rgba(8, 51, 41, .24);
  }

  .brand-plane {
    margin-top: 1.2cqw;
    font-size: 15.4cqw;
    line-height: .82;
    letter-spacing: -.01em;
    color: #ffd44b;
    -webkit-text-stroke-width: .7cqw;
    text-shadow:
      0 1.2cqw 0 #174b3d,
      0 2.2cqw 0 #0d352b,
      0 3.2cqw 3.6cqw rgba(8, 51, 41, .24);
    transform: rotate(-2deg);
  }

  @keyframes brand-in {
    from { transform: translateY(-4cqw) scale(.94); }
    to   { transform: none; }
  }

  .ready-panel {
    width: 100%;
    max-width: 92cqw;
    padding: 4.4cqw 4.8cqw 4.6cqw;
    border-radius: 5.4cqw;
    text-align: center;
    background: linear-gradient(180deg, rgba(255, 252, 242, .95), rgba(255, 243, 215, .91));
    border: 1px solid rgba(255, 255, 255, .85);
    box-shadow:
      0 .9cqw 0 rgba(16, 75, 59, .12),
      0 3.2cqw 6cqw rgba(9, 57, 46, .22),
      inset 0 .5cqw 0 #fffdf5;
    -webkit-backdrop-filter: blur(15px) saturate(1.1);
    backdrop-filter: blur(15px) saturate(1.1);
    animation: panel-in .75s .08s cubic-bezier(.16, 1.2, .4, 1) both;
  }

  @keyframes panel-in {
    from { transform: translateY(5cqw) scale(.97); }
    to   { transform: none; }
  }

  .ready-hint {
    margin: 0 0 3.1cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1.6cqw;
    color: #28594b;
    font-size: 2.65cqw;
    font-weight: 700;
    letter-spacing: .01em;
    line-height: 1.35;
  }

  .keycap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 7.8cqw;
    padding: 1.1cqw 1.8cqw .95cqw;
    border-radius: 1.8cqw;
    color: #2e5d4e;
    background: #fffdf4;
    border: 1px solid rgba(23, 75, 61, .22);
    box-shadow: 0 .45cqw 0 rgba(23, 75, 61, .2), inset 0 -.2cqw 0 rgba(23, 75, 61, .08);
    font-family: var(--font-display);
    font-size: 1.9cqw;
    font-weight: 900;
    letter-spacing: .12em;
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2.2cqw;
    width: 100%;
    min-height: 11.4cqw;
    padding: 2.4cqw 5cqw;
    border-radius: 999px;
    border: 0;
    cursor: pointer;
    color: #173e31;
    background: linear-gradient(180deg, #ffe87b 0%, #ffd146 50%, #f6b62b 100%);
    box-shadow:
      inset 0 .55cqw 0 rgba(255, 255, 255, .7),
      inset 0 -.9cqw 0 rgba(171, 94, 4, .16),
      0 .9cqw 0 #c67e15,
      0 2cqw 3.2cqw rgba(12, 68, 52, .22);
    font-family: var(--font-display);
    font-size: 4.15cqw;
    font-weight: 900;
    letter-spacing: .12em;
    line-height: 1;
    text-transform: uppercase;
    transition: transform .12s ease, box-shadow .12s ease, filter .2s ease;
  }

  .btn svg {
    width: 4.4cqw;
    height: 4.4cqw;
    flex: 0 0 auto;
    transition: transform .2s ease;
  }

  .btn:hover {
    filter: brightness(1.045);
    transform: translateY(-1px);
  }

  .btn:hover svg { transform: translateX(.7cqw); }

  .btn:active {
    transform: translateY(.7cqw);
    box-shadow:
      inset 0 .5cqw 0 rgba(255, 255, 255, .65),
      inset 0 -.7cqw 0 rgba(171, 94, 4, .14),
      0 .25cqw 0 #c67e15,
      0 .9cqw 1.6cqw rgba(12, 68, 52, .18);
  }

  .ready-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.8cqw;
    margin: 2.8cqw 0 0;
    color: #4e7567;
    font-size: 2.05cqw;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .ready-meta strong {
    color: #1d5747;
    font-family: var(--font-display);
    font-size: 2.5cqw;
    letter-spacing: 0;
  }

  .dot {
    width: .8cqw;
    height: .8cqw;
    border-radius: 50%;
    background: #9cb6a9;
  }

  /* ---------------------------------------------------------- over screen */

  .over-screen,
  .pause-screen {
    background: rgba(7, 47, 40, .3);
    -webkit-backdrop-filter: blur(9px) saturate(.92);
    backdrop-filter: blur(9px) saturate(.92);
    display: grid;
    place-items: center;
    padding: 7cqw;
  }

  .over-screen {
    pointer-events: none;
  }

  .over-screen.is-visible,
  .pause-screen.is-visible {
    pointer-events: auto;
  }

  .over-card {
    position: relative;
    z-index: 2;
    width: min(100%, 87cqw);
    max-width: 390px;
    padding: 5.8cqw 5.6cqw 4.6cqw;
    border-radius: 6.2cqw;
    text-align: center;
    background: linear-gradient(180deg, #fffdf3 0%, #fff6dd 100%);
    border: .68cqw solid #164b3d;
    box-shadow:
      0 1.1cqw 0 rgba(12, 59, 47, .3),
      0 5cqw 10cqw rgba(4, 41, 33, .42),
      inset 0 .7cqw 0 #fff;
    outline: none;
    opacity: 0;
    transform: translateY(5cqw) scale(.94);
    transition: opacity .26s ease, transform .48s cubic-bezier(.18, 1.35, .4, 1);
  }

  .over-screen.is-visible .over-card {
    opacity: 1;
    transform: none;
  }

  .over-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: .9cqw;
    border-radius: 0 0 999px 999px;
    background: linear-gradient(90deg, transparent, #ffd44c 22%, #f6a41b 78%, transparent);
    opacity: .9;
  }

  .card-eyebrow {
    margin: 0;
    color: #4d7d6c;
    font-size: 2.05cqw;
    font-weight: 900;
    letter-spacing: .32em;
    text-transform: uppercase;
  }

  .over-card h2 {
    margin: 1.5cqw 0 3.4cqw;
    font-family: var(--font-display);
    font-size: 9.6cqw;
    font-weight: 900;
    line-height: .95;
    letter-spacing: -.025em;
    color: #163f35;
    text-transform: uppercase;
    text-shadow: 0 .5cqw 0 rgba(255, 255, 255, .9);
  }

  .result-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4.4cqw;
    margin: 0 auto;
    padding: 1cqw 0 0;
  }

  .medal-wrap {
    width: 22cqw;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.3cqw;
  }

  .medal {
    position: relative;
    width: 17.2cqw;
    height: 17.2cqw;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff9df;
    border: .65cqw solid #1d5342;
    font-size: 8.2cqw;
    line-height: 1;
    text-shadow: 0 .5cqw .6cqw rgba(76, 37, 1, .25);
    box-shadow:
      inset 0 1.1cqw 1.1cqw rgba(255, 255, 255, .55),
      inset 0 -1.4cqw 1.2cqw rgba(83, 42, 0, .2),
      0 .8cqw 0 rgba(21, 62, 49, .18);
    transition: transform .35s cubic-bezier(.2, 1.5, .4, 1);
  }

  .over-screen.is-visible .medal { transform: rotate(-4deg); }

  .medal::after {
    content: "";
    position: absolute;
    top: 16%;
    left: 19%;
    width: 30%;
    height: 17%;
    border-radius: 50%;
    background: rgba(255, 255, 255, .55);
    filter: blur(.35cqw);
    transform: rotate(-28deg);
  }

  .medal--none {
    color: #9b9d8e;
    background: radial-gradient(circle at 36% 28%, #efeee3 0 22%, #d3d3c4 46%, #b7b9aa 100%);
  }

  .medal--bronze {
    background: radial-gradient(circle at 36% 28%, #ffe0be 0 18%, #e5a166 42%, #b7652b 75%, #8c481d 100%);
  }

  .medal--silver {
    background: radial-gradient(circle at 36% 28%, #ffffff 0 16%, #e1e7e4 38%, #aebdb9 72%, #81928f 100%);
    color: #ffffff;
  }

  .medal--gold {
    background: radial-gradient(circle at 36% 28%, #fffbd0 0 16%, #ffe36d 38%, #f6b529 70%, #cd7f0d 100%);
    color: #fffbe6;
  }

  .medal--platinum {
    background: radial-gradient(circle at 36% 28%, #ffffff 0 14%, #dff9f2 32%, #a6e5dc 58%, #5bb4ad 82%, #3e8e89 100%);
    color: #f7fffd;
  }

  .medal-label {
    color: #2e5d4f;
    font-size: 1.95cqw;
    font-weight: 900;
    letter-spacing: .15em;
    text-transform: uppercase;
  }

  .stats {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 2.8cqw;
  }

  .stat { min-width: 0; }

  .stat-label {
    display: block;
    margin-bottom: .6cqw;
    color: #568071;
    font-size: 1.95cqw;
    font-weight: 900;
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  .stat-value {
    display: block;
    color: #163f35;
    font-family: var(--font-display);
    font-size: 8.6cqw;
    font-weight: 900;
    line-height: .95;
    letter-spacing: -.04em;
    text-shadow: 0 .35cqw 0 #fff;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-divider {
    width: 1px;
    height: 8.6cqw;
    background: rgba(24, 73, 60, .17);
  }

  .new-best {
    display: none;
    width: max-content;
    margin: 2.4cqw auto 0;
    padding: 1.35cqw 3.1cqw 1.2cqw;
    border-radius: 999px;
    color: #7b4300;
    background: linear-gradient(180deg, #fff0a9, #ffdc63);
    box-shadow: 0 .4cqw 0 #dfa32a, 0 1cqw 1.8cqw rgba(111, 68, 0, .12);
    font-family: var(--font-display);
    font-size: 2.15cqw;
    font-weight: 900;
    letter-spacing: .16em;
    text-transform: uppercase;
    animation: badge-pop .55s .18s cubic-bezier(.2, 1.6, .4, 1) both;
  }

  .new-best.is-on { display: inline-flex; align-items: center; gap: 1cqw; }

  .new-best svg { width: 3cqw; height: 3cqw; }

  @keyframes badge-pop {
    from { opacity: 0; transform: scale(.6) rotate(-6deg); }
    to   { opacity: 1; transform: none; }
  }

  .over-card .btn {
    margin-top: 3.6cqw;
    min-height: 10.6cqw;
    font-size: 3.85cqw;
  }

  .text-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 36px;
    margin: 1.6cqw auto 0;
    padding: 2cqw 3cqw;
    border-radius: 2.4cqw;

    font-size: 2.15cqw;

    letter-spacing: .16em;

  }

  .text-btn:hover {
    color: #153f35;
    background: rgba(22, 75, 61, .06);
  }

  .confetti {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
    border-radius: inherit;
  }

  .confetti span {
    position: absolute;
    top: -24px;
    display: block;
    border-radius: 2px;
    animation: confetti-fall var(--duration, 2.2s) cubic-bezier(.18, .65, .35, 1) var(--delay, 0s) forwards;
    opacity: 0;
  }

  @keyframes confetti-fall {
    0%   { opacity: 0; transform: translate3d(0, -20px, 0) rotate(0deg); }
    8%   { opacity: 1; }
    100% { opacity: 0; transform: translate3d(var(--drift, 0px), 900px, 0) rotate(var(--spin, 540deg)); }
  }

  /* --------------------------------------------------------- pause screen */

  .pause-screen {
    z-index: 31;
  }

  .pause-card {
    width: min(100%, 80cqw);
    padding: 6.5cqw 6cqw 5cqw;
    border-radius: 6cqw;
    text-align: center;
    background: linear-gradient(180deg, #fffdf3, #fff5d9);
    border: .68cqw solid #164b3d;
    box-shadow:
      0 1cqw 0 rgba(12, 59, 47, .28),
      0 5cqw 10cqw rgba(4, 41, 33, .4),
      inset 0 .7cqw 0 #fff;
    opacity: 0;
    transform: translateY(4cqw) scale(.96);
    transition: opacity .26s ease, transform .45s cubic-bezier(.18, 1.35, .4, 1);
  }

  .pause-screen.is-visible .pause-card {
    opacity: 1;
    transform: none;
  }

  .pause-card h2 {
    margin: 0 0 1.8cqw;
    color: #163f35;
    font-family: var(--font-display);
    font-size: 9.4cqw;
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
  }

  .pause-note {
    margin: 0 auto 4.4cqw;
    max-width: 58cqw;
    color: #598071;
    font-size: 2.35cqw;
    font-weight: 600;
    line-height: 1.5;
  }

  .pause-card .btn { min-height: 10.6cqw; font-size: 3.8cqw; }

  .pause-card .text-btn { margin-top: 1.4cqw; }

  /* --------------------------------------------------------------- effects */

  .flash {
    position: absolute;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    background: #fff7db;
    opacity: 0;
  }

  .flash.is-flashing {
    animation: flash-out .34s ease-out forwards;
  }

  @keyframes flash-out {
    0%   { opacity: .55; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand,
    .ready-panel,
    .new-best,
    .confetti span {
      animation: none !important;
    }
    .over-card,
    .pause-card,
    .screen {
      transition-duration: .01ms !important;
    }
  }

  @media (max-height: 620px) {
    .game {
      border-radius: 20px;
    }
  }
</style>

<body>
  <main class="game" id="game" data-mode="ready" aria-label="Flappy Plane game">

            <path d="M16.2 8.7a4.7 4.7 0 0 1 0 6.6M18.8 6.1a8.3 8.3 0 0 1 0 11.8" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
          <svg class="icon-muted" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 9.5h3.4L13 5v14l-5.6-4.5H4v-5Z" fill="currentColor"/>
            <path d="m16.5 9 5 5m0-5-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>

        <button class="btn" id="resumeBtn" type="button">
          <span>Keep flying</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 9 6-9 6V6Z" fill="currentColor"/></svg>
        </button>
        <button class="text-btn" id="quitBtn" type="button">Back to start</button>

    <div class="flash" id="flash" aria-hidden="true"></div>
    <p class="sr-only" id="announcer" aria-live="polite"></p>
  </main>

<script>
(() => {
  "use strict";

  /* ============================================================== constants */

  const W = 480;
  const H = 800;
  const GROUND_Y = 720;
  const GROUND_H = H - GROUND_Y;
  const PLANE_X = 136;
  const PLANE_R = 13;
  const PLANE_SCALE = 0.92;
  const TOWER_W = 76;
  const ROOF_H = 30;
  const ROOF_OVERHANG = 9;
  const GRAVITY = 1880;
  const THRUST_V = -548;
  const MAX_FALL = 790;
  const TAU = Math.PI * 2;
  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const STORAGE_BEST = "flappy-bird.best.v1";
  const STORAGE_MUTED = "flappy-bird.muted.v1";

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (min, max) => min + Math.random() * (max - min);
  const mod = (n, m) => ((n % m) + m) % m;
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const gameEl = document.getElementById("game");
  const scoreHud = document.getElementById("scoreHud");
  const bestHud = document.getElementById("bestHud");
  const readyScreen = document.getElementById("readyScreen");
  const overScreen = document.getElementById("overScreen");
  const pauseScreen = document.getElementById("pauseScreen");
  const overCard = document.getElementById("overCard");
  const pauseCard = document.getElementById("pauseCard");
  const playBtn = document.getElementById("playBtn");
  const replayBtn = document.getElementById("replayBtn");
  const homeBtn = document.getElementById("homeBtn");
  const resumeBtn = document.getElementById("resumeBtn");
  const quitBtn = document.getElementById("quitBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const soundBtn = document.getElementById("soundBtn");
  const finalScore = document.getElementById("finalScore");
  const finalBest = document.getElementById("finalBest");
  const medalEl = document.getElementById("medal");
  const medalLabel = document.getElementById("medalLabel");
  const newBestEl = document.getElementById("newBest");
  const confettiEl = document.getElementById("confetti");
  const flashEl = document.getElementById("flash");
  const announcer = document.getElementById("announcer");

  /* ================================================================ helpers */

  function readStorage(key, fallback) {
    try {
      const value = window.localStorage.getItem(key);
      return value === null ? fallback : value;
    } catch (err) {
      return fallback;
    }
  }

  function writeStorage(key, value) {
    try {
      window.localStorage.setItem(key, String(value));
    } catch (err) {
      /* Private mode or storage disabled — the game still works. */
    }
  }

  function mulberry32(seed) {
    let a = seed;
    return function random() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function roundedRectPath(x, y, w, h, r) {
    const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function circleRectCollision(cx, cy, radius, rx, ry, rw, rh) {
    const nx = clamp(cx, rx, rx + rw);
    const ny = clamp(cy, ry, ry + rh);
    const dx = cx - nx;
    const dy = cy - ny;
    return dx * dx + dy * dy < radius * radius;
  }

  /* ================================================================ audio */

  const audio = (() => {
    let context = null;
    let master = null;
    let noiseBuffer = null;
    let muted = readStorage(STORAGE_MUTED, "0") === "1";

    function ensure() {
      if (!context) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        context = new AudioCtor();
        master = context.createGain();
        master.gain.value = 0.55;
        master.connect(context.destination);

        const length = Math.floor(context.sampleRate * 0.5);
        noiseBuffer = context.createBuffer(1, length, context.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < length; i += 1) data[i] = Math.random() * 2 - 1;
      }
      if (context.state === "suspended") context.resume();
      return context;
    }

    function tone(startFreq, endFreq, duration, type = "sine", peak = 0.1, delay = 0) {
      if (muted) return;
      const ac = ensure();
      if (!ac) return;
      const start = ac.currentTime + delay;
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(Math.max(20, startFreq), start);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), start + duration);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gain);
      gain.connect(master);
      osc.start(start);
      osc.stop(start + duration + 0.03);
    }

    function noise(duration, peak = 0.05, startFreq = 1200, endFreq = 300, delay = 0) {
      if (muted) return;
      const ac = ensure();
      if (!ac || !noiseBuffer) return;
      const start = ac.currentTime + delay;
      const source = ac.createBufferSource();
      const filter = ac.createBiquadFilter();
      const gain = ac.createGain();
      source.buffer = noiseBuffer;
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(startFreq, start);
      filter.frequency.exponentialRampToValueAtTime(Math.max(40, endFreq), start + duration);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      source.start(start);
      source.stop(start + duration + 0.02);
    }

    return {
      ensure,
      get muted() { return muted; },
      setMuted(value) {
        muted = Boolean(value);
        writeStorage(STORAGE_MUTED, muted ? "1" : "0");
        if (!muted) ensure();
      },
      boost() {
        if (muted) return;
        tone(172, 285, 0.13, "triangle", 0.07);
        tone(86, 122, 0.15, "sawtooth", 0.022, 0.008);
        noise(0.13, 0.028, 950, 380);
      },
      score() {
        if (muted) return;
        tone(784, 784, 0.075, "sine", 0.055);
        tone(1175, 1175, 0.13, "sine", 0.045, 0.075);
      },
      hit() {
        if (muted) return;
        tone(170, 58, 0.3, "sawtooth", 0.13);
        noise(0.22, 0.11, 700, 90);
      },
      explosion() {
        if (muted) return;
        tone(128, 34, 0.5, "sawtooth", 0.14);
        tone(62, 28, 0.65, "sine", 0.18);
        noise(0.5, 0.16, 1800, 70);
        tone(500, 150, 0.22, "square", 0.04);
        noise(0.3, 0.05, 600, 80, 0.12);
      },
      swoosh() {
        if (muted) return;
        noise(0.2, 0.035, 1500, 220);
      },
      click() {
        if (muted) return;
        tone(620, 520, 0.045, "triangle", 0.04);
      }
    };
  })();

  /* ============================================================== game data */

  let mode = "ready";
  let score = 0;
  let best = Math.max(0, Math.floor(Number(readStorage(STORAGE_BEST, "0")) || 0));
  let newBest = false;
  let towerTimer = 1.25;
  let ambientTime = 0;
  let worldScroll = 0;
  let dieTimer = 0;
  let overShownAt = 0;
  let shakeTime = 0;
  let shakeDuration = 0.3;
  let shakePower = 0;
  let smokeTimer = 0;
  let dpr = 1;
  let lastFrame = 0;

  const plane = { x: PLANE_X, y: 348, vy: 0, rot: 0, enginePhase: 0, landed: false };
  let towers = [];
  let particles = [];
  let explosions = [];

  const rng = mulberry32(0xF1A99B1D);

  const clouds = Array.from({ length: 9 }, (_, i) => ({
    x: rng() * (W + 280) - 140,
    y: 42 + rng() * 278,
    scale: 0.55 + rng() * 0.78,
    speed: 2.5 + rng() * 6.5,
    alpha: 0.28 + rng() * 0.37,
    shape: i % 3
  }));

  const pebbles = Array.from({ length: 42 }, () => ({
    x: rng() * W,
    y: 20 + rng() * (GROUND_H - 34),
    r: 1 + rng() * 2.4,
    alpha: 0.1 + rng() * 0.2
  }));

  const cityBuildings = [];
  {
    let x = -30;
    let index = 0;
    while (x < 860) {
      const w = 22 + Math.floor(rng() * 38);
      const h = 26 + Math.floor(rng() * 88);
      cityBuildings.push({
        x,
        w,
        h,
        roof: index % 5 === 0,
        antenna: rng() > 0.82,
        tone: index % 3,
        windows: index % 4 !== 0
      });
      x += w + 5 + Math.floor(rng() * 12);
      index += 1;
    }
    cityBuildings.tileWidth = x + 40;
  }

  /* ================================================================ screens */

  function syncBestLabels() {
    document.querySelectorAll("[data-best]").forEach((el) => {
      el.textContent = String(best);
    });
    bestHud.textContent = String(best);
  }

  function setMode(nextMode) {
    mode = nextMode;
    gameEl.dataset.mode = nextMode;
    readyScreen.classList.toggle("is-visible", nextMode === "ready");
    overScreen.classList.toggle("is-visible", nextMode === "over");
    pauseScreen.classList.toggle("is-visible", nextMode === "paused");
    readyScreen.setAttribute("aria-hidden", String(nextMode !== "ready"));
    overScreen.setAttribute("aria-hidden", String(nextMode !== "over"));
    pauseScreen.setAttribute("aria-hidden", String(nextMode !== "paused"));
  }

  function resetRound() {
    score = 0;
    towers = [];
    particles = [];
    explosions = [];
    towerTimer = 1.25;
    dieTimer = 0;
    overShownAt = 0;
    newBest = false;
    shakeTime = 0;
    smokeTimer = 0;
    plane.x = PLANE_X;
    plane.y = 348;
    plane.vy = 0;
    plane.rot = 0;
    plane.enginePhase = 0;
    plane.landed = false;
    scoreHud.textContent = "0";
    scoreHud.classList.remove("pop");
    newBestEl.classList.remove("is-on");
    confettiEl.replaceChildren();
    canvas.style.transform = "";
  }

  function startGame() {
    if (mode === "playing" || mode === "dying" || mode === "paused") return;
    audio.ensure();
    resetRound();
    setMode("playing");
    if (document.activeElement && typeof document.activeElement.blur === "function") {
      document.activeElement.blur();
    }
    plane.vy = THRUST_V * 0.82;
    plane.enginePhase = 0;
    spawnPuffs(plane.x - 22, plane.y + 4, 3);
    audio.boost();
  }

  function goHome() {
    audio.click();
    resetRound();
    setMode("ready");
    syncBestLabels();
    announcer.textContent = "";
    playBtn.focus({ preventScroll: true });
  }

  function pauseGame() {
    if (mode !== "playing") return;
    setMode("paused");
    audio.click();
    pauseCard.focus({ preventScroll: true });
  }

  function resumeGame() {
    if (mode !== "paused") return;
    setMode("playing");
    audio.click();
    if (document.activeElement && typeof document.activeElement.blur === "function") {
      document.activeElement.blur();
    }
    lastFrame = performance.now();
  }

  function togglePause() {
    if (mode === "playing") pauseGame();
    else if (mode === "paused") resumeGame();
  }

  function medalFor(value) {
    if (value >= 35) return { key: "platinum", label: "Platinum" };
    if (value >= 20) return { key: "gold", label: "Gold" };
    if (value >= 10) return { key: "silver", label: "Silver" };
    if (value >= 3) return { key: "bronze", label: "Bronze" };
    return { key: "none", label: "No medal" };
  }

  function showGameOver() {
    if (mode !== "dying") return;

    newBest = score > best;
    if (newBest) {
      best = score;
      writeStorage(STORAGE_BEST, best);
    }
    syncBestLabels();

    const medal = medalFor(score);
    medalEl.className = `medal medal--${medal.key}`;
    medalEl.setAttribute("aria-label", medal.key === "none" ? "No medal" : `${medal.label} medal`);
    medalLabel.textContent = medal.label;

    finalScore.textContent = String(score);
    finalBest.textContent = String(best);
    newBestEl.classList.toggle("is-on", newBest);

    announcer.textContent = newBest
      ? `Game over. New best score: ${score}.`
      : `Game over. Score: ${score}. Best: ${best}.`;

    setMode("over");
    overShownAt = performance.now();

    if (newBest) {
      window.setTimeout(() => {
        if (mode === "over") fireConfetti();
      }, 170);
    }

    window.setTimeout(() => {
      if (mode === "over") overCard.focus({ preventScroll: true });
    }, 60);

  function fireConfetti() {
    const colors = ["#ffd447", "#ff8a3c", "#f45d5d", "#65cfa0", "#7ac7f5", "#fff4c2"];
    for (let i = 0; i < 34; i += 1) {
      const piece = document.createElement("span");
      const width = 5 + Math.random() * 8;
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.width = `${width}px`;
      piece.style.height = `${8 + Math.random() * 12}px`;
      piece.style.background = pick(colors);
      piece.style.setProperty("--drift", `${rand(-80, 80).toFixed(0)}px`);
      piece.style.setProperty("--spin", `${rand(300, 1000).toFixed(0)}deg`);
      piece.style.setProperty("--duration", `${rand(1.8, 2.7).toFixed(2)}s`);
      piece.style.setProperty("--delay", `${rand(0, 0.28).toFixed(2)}s`);
      if (i % 4 === 0) piece.style.borderRadius = "50%";
      confettiEl.appendChild(piece);
    }
    window.setTimeout(() => {
      if (confettiEl.childElementCount > 0) confettiEl.replaceChildren();
    }, 3300);
  }

  /* ================================================================ effects */

  function addShake(power, duration) {
    if (REDUCED_MOTION) return;
    shakePower = Math.max(shakePower, power);
    shakeTime = Math.max(shakeTime, duration);
    shakeDuration = Math.max(duration, 0.15);
  }
